<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epsche Schulden Saga</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #11182f;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      width: min(900px, 100vw);
      min-height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #11182f;
      box-shadow: 0 0 30px rgba(41, 231, 255, 0.45);
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 8px 12px;
      color: #29e7ff;
      background: rgba(0, 0, 0, 0.55);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Spiel wird geladen …</div>
  <div id="game-container"></div>

  <!-- Phaser 3 von CDN laden -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <script>
    // Fehler direkt auf der Seite anzeigen
    window.addEventListener("error", function (event) {
      const status = document.getElementById("status");
      if (status) {
        status.textContent = "JavaScript-Fehler: " + event.message;
      }
    });

    window.addEventListener("load", function () {
      const status = document.getElementById("status");

      if (typeof Phaser === "undefined") {
        status.textContent = "Phaser konnte nicht geladen werden.";
        return;
      }

      status.textContent = "Phaser geladen – Spiel startet …";

      const script = document.createElement("script");
      script.src = "./game.js?v=side2";
      script.onload = function () {
        status.textContent = "Spiel geladen";
      };
      script.onerror = function () {
        status.textContent = "game.js konnte nicht geladen werden.";
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
