<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epsche Schulden Saga</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #11182f;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      width: min(900px, 100vw);
      min-height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #11182f;
      box-shadow: 0 0 30px rgba(41, 231, 255, 0.45);
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 8px 12px;
      color: #29e7ff;
      background: rgba(0, 0, 0, 0.55);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Spiel wird geladen …</div>
  <div id="game-container"></div>

  <!-- Phaser 3 von CDN laden -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    if (typeof Phaser !== "undefined") {
      document.getElementById("status").textContent = "Phaser geladen – Spiel startet …";
    }
  </script>

  <!-- Spielmodule: klassische Skripte in Abhängigkeitsreihenfolge.
       Kein Build-Schritt, läuft auch direkt von der Festplatte (file://). -->
  <script src="./js/data.js?v=r2"></script>
  <script src="./js/state.js?v=r2"></script>
  <script src="./js/save.js?v=r2"></script>
  <script src="./js/input.js?v=r2"></script>
  <script src="./js/hud.js?v=r2"></script>
  <script src="./js/progress.js?v=r2"></script>
  <script src="./js/player.js?v=r2"></script>
  <script src="./js/enemies.js?v=r2"></script>
  <script src="./js/waves.js?v=r2"></script>
  <script src="./js/scene.js?v=r2"></script>
  <script src="./js/main.js?v=r2"></script>

  <script>
    // Fehler direkt auf der Seite anzeigen
    window.addEventListener("error", function (event) {
      const status = document.getElementById("status");
      if (status) {
        status.textContent = "JavaScript-Fehler: " + event.message;
      }
    });

    window.addEventListener("load", function () {
      const status = document.getElementById("status");

      if (typeof Phaser === "undefined") {
        status.textContent = "Phaser konnte nicht geladen werden.";
        return;
      }

      // Alle Module müssen da sein, sonst fehlt eine Datei
      const modules = ["Data", "State", "Save", "Input", "Hud", "Progress", "Player", "Enemies", "Waves", "Scene"];
      const missing = !window.Saga ? modules : modules.filter(function (name) { return !window.Saga[name]; });
      if (missing.length) {
        status.textContent = "Spielmodule konnten nicht geladen werden: " + missing.join(", ");
        return;
      }

      status.textContent = "Spiel geladen";
    });
  </script>
</body>
</html>
